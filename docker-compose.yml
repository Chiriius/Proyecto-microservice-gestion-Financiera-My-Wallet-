version: '3.8'
services:

  dbmywallet:
    image: mongo:noble
    container_name: mywalletdbmongousers
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - 27017:27017
    volumes:
      - db_data:/data/db
    networks:
      - mywallet

  dbpostgrestransactions:
    image: postgres:15
    container_name: mywalletdbpostgrestransactions
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mywallet

volumes:
  db_data:
  postgres_data:

networks:
  mywallet:
    driver: bridge